<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopta Huellas</title>
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="#" class="logo">
                <img src="assets/images/logo.png" alt="Adopta Huellas">
                <span>Adopta Huellas</span>
            </a>

            <div class="nav-links">
                <a href="#inicio">Inicio</a>
                <a href="#animales">Animales</a>
                <a href="#nosotros">Nosotros</a>
                <a href="#contacto">Contacto</a>
            </div>
        </nav>
    </header>


    <main>

        <section id="inicio" class="hero">

            <div class="hero-content">

                <p class="hero-label">🐾 ADOPTA HUELLAS</p>

                <h1>
                    Encuentra a tu
                    <span>nuevo mejor amigo.</span>
                </h1>

                <p class="hero-description">
                    Hay una huella esperando convertirse
                    en parte de tu familia.
                </p>

                <a href="#animales" class="hero-button">
                    Ver animales
                    <span>→</span>
                </a>

            </div>


            <div class="hero-image">

                <div class="hero-circle"></div>

                <img
                    src="assets/images/logo.png"
                    alt="Perro y gato buscando un hogar"
                >

            </div>

        </section>

    </main>

</body>

</html>
